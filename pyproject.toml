[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsnd2"
version = "0.1.0"
description = "Python bindings for the rsnd2 reader with an nd2-compatible API"
readme = "fast_nd2_reader_implementation_plan.md"
requires-python = ">=3.10"
authors = [{ name = "rsnd2 contributors" }]
dependencies = []

[project.optional-dependencies]
array = ["numpy"]
dask = ["dask[array]", "resource-backed-dask-array"]
xarray = ["xarray", "dask[array]"]
tiff = ["tifffile", "ome-types"]

[tool.setuptools]
package-dir = {"" = "src-python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src-python"]

[tool.setuptools.package-data]
rsnd2 = ["librsnd2.so", "librsnd2.dylib", "rsnd2.dll", "py.typed"]
